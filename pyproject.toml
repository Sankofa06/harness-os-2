[project]
name = "harness-os"
version = "0.1.0"
description = "Harness OS — local-first agent operating system and AI compute control plane"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-Pending" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "textual>=0.86",
    "websockets>=13.0",
]

[project.optional-dependencies]
ssh = ["asyncssh>=2.17"]
node = ["psutil>=6.0"]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.uv]
python-preference = "managed"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["harness"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
